<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gentle boi</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/your-kit-code.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="logo">Gentle <span>boi</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="project.html">Projects</a></li>
        <li><a href="testimonies.html">Testimonies</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="contact">
    <div class="contact-header">
      <h1>Get in <span>Touch</span></h1>
      <p>Have a project in mind or just want to say hi? Let’s connect!</p>
    </div>
    <div class="contact-container">
      <!-- Contact Form -->
      <form action="#" method="post" class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit" class="btn">Send Message</button>
      </form>
      <!-- Social Links -->
      <div class="contact-socials">
        <h2>Connect with me</h2>
        <div class="icons">
          <a href="https://facebook.com/" target="_blank"><i class="fab fa-facebook"></i></a>
          <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
          <a href="https://wa.me/" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Gentle boi. All rights reserved.</p>
  </footer>
</body>
</html>
